[project]
name = "lana-argentina"
version = "0.1.0"
description = "Sitio visual con las estadísticas mensuales de exportación de la Federación Lanera Argentina"
requires-python = ">=3.12"
dependencies = ["pdfplumber>=0.11"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes 2 s or more (skip with -m 'not slow')"]
